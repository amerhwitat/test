services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      NODE_ENV: production
      TRUST_PROXY: "1"
      VOICECONNECT_REGISTRY: /var/lib/voiceconnect/peers.json
    volumes:
      - voiceconnect-data:/var/lib/voiceconnect
    expose: ["8787"]
    networks: [edge, media]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on: [app]
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    env_file: .env.production
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --lt-cred-mech
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:?Set TURN_SHARED_SECRET}
      - --realm=${TURN_REALM:?Set TURN_REALM}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --external-ip=${TURN_EXTERNAL_IP:?Set TURN_EXTERNAL_IP}
      - --no-cli
      - --no-multicast-peers
      - --no-loopback-peers
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    networks: [media]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
networks:
  edge:
  media:
volumes:
  voiceconnect-data:
  caddy-data:
  caddy-config:
