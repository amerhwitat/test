name: Python and Web tests

on:
  push:
    branches: [main, "improvement/**", "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library test suite
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q chimera_py research_app tools tests

  node-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Node web server syntax
        run: node --check web/server.js
      - name: Check browser JavaScript syntax
        run: node --check web/app.js
      - name: Start Python API and web bridge
        shell: bash
        run: |
          python3 -m chimera_py.main --api-port 8765 >/tmp/chimera-python.log 2>&1 &
          PY_PID=$!
          sleep 2
          CHIMERA_EXTERNAL_PYTHON=1 CHIMERA_WEB_PORT=3000 node web/server.js >/tmp/chimera-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill $WEB_PID $PY_PID 2>/dev/null || true' EXIT
          sleep 2
          curl --fail http://127.0.0.1:3000/api/health
          curl --fail http://127.0.0.1:3000/api/state >/dev/null

  native-aurora:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Wayland and headless display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libwayland-egl1-mesa libwayland-server0 libgles2-mesa-dev libxkbcommon-dev pkg-config ninja-build xvfb
      - name: Set up Python for Qt installer
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt installer
        run: python -m pip install --disable-pip-version-check aqtinstall==3.2.0
      - name: Install Qt 6.11.2
        run: python -m aqt install-qt --outputdir "$HOME/Qt" linux desktop 6.11.2 gcc_64
      - name: Configure Aurora native compositor
        run: |
          cmake -S native/aurora -B build/aurora -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HOME/Qt/6.11.2/gcc_64"
      - name: Build Aurora native compositor
        run: cmake --build build/aurora --parallel
      - name: Validate generated QML tooling
        run: |
          "$HOME/Qt/6.11.2/gcc_64/bin/qmllint" \
            -I "$HOME/Qt/6.11.2/gcc_64/qml" \
            native/aurora/Aurora.qml
      - name: Run nested Wayland smoke test
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" ctest --test-dir build/aurora --output-on-failure
