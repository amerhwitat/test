name: Python and Web tests

on:
  push:
    branches: [main, "improvement/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Run standard-library test suite
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q chimera_py research_app tools tests

  node-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Node web server syntax
        run: node --check web/server.js
      - name: Check browser JavaScript syntax
        run: node --check web/app.js
      - name: Start Python API and web bridge
        shell: bash
        run: |
          python3 -m chimera_py.main --api-port 8765 >/tmp/chimera-python.log 2>&1 &
          PY_PID=$!
          sleep 2
          CHIMERA_EXTERNAL_PYTHON=1 CHIMERA_WEB_PORT=3000 node web/server.js >/tmp/chimera-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill $WEB_PID $PY_PID 2>/dev/null || true' EXIT
          sleep 2
          curl --fail http://127.0.0.1:3000/api/health
          curl --fail http://127.0.0.1:3000/api/state >/dev/null
