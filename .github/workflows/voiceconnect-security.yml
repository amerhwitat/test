name: VoiceConnect security analysis
on:
  push:
    branches: [main, feat/voiceconnect-p2p-camera]
    paths: ['voiceconnect-p2p/**', '.github/workflows/voiceconnect-security.yml']
  pull_request:
    paths: ['voiceconnect-p2p/**', '.github/workflows/voiceconnect-security.yml']
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  pull-requests: read
concurrency:
  group: voiceconnect-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  codeql:
    name: CodeQL JavaScript/TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for accidentally committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  sbom:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voiceconnect-p2p
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: voiceconnect-p2p/package-lock.json
      - name: Install locked dependency graph
        run: npm ci
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx > voiceconnect-sbom.cdx.json
      - name: Upload dependency inventory
        uses: actions/upload-artifact@v4
        with:
          name: voiceconnect-cyclonedx-sbom
          path: voiceconnect-p2p/voiceconnect-sbom.cdx.json
          if-no-files-found: error
          retention-days: 90
