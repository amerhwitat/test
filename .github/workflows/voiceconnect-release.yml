name: VoiceConnect release packages
on:
  push:
    tags:
      - "voiceconnect-v*"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: ubuntu-latest
            script: build:linux
          - os: macos-latest
            script: build:mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: voiceconnect-p2p
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libfuse2
      - run: npm install
      - run: npm install --no-save sharp png-to-ico
      - run: node generate-icon.mjs
      - run: npm test
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: voiceconnect-${{ matrix.os }}-release
          path: voiceconnect-p2p/dist/*
          if-no-files-found: error
          retention-days: 90
  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: voiceconnect-*-release
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release-assets/* --title "VoiceConnect $TAG" --generate-notes
