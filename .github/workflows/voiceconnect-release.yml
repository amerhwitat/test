name: VoiceConnect release packages
on:
  push:
    tags:
      - "voiceconnect-v*"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: ubuntu-latest
            script: build:linux
          - os: macos-latest
            script: build:mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: voiceconnect-p2p
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libfuse2
      - run: npm install
      - run: npm install --no-save sharp png-to-ico
      - run: node generate-icon.mjs
      - run: npm test
      - name: Require Windows Authenticode certificate
        if: runner.os == 'Windows'
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            throw "Configure WINDOWS_CSC_LINK (base64/PFX) and WINDOWS_CSC_KEY_PASSWORD before publishing a Windows release."
          }
      - name: Require Apple Developer ID and notarization credentials
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu
          test -n "$CSC_LINK" || { echo "Missing APPLE_CSC_LINK" >&2; exit 2; }
          test -n "$CSC_KEY_PASSWORD" || { echo "Missing APPLE_CSC_KEY_PASSWORD" >&2; exit 2; }
          test -n "$APPLE_ID" || { echo "Missing APPLE_ID" >&2; exit 2; }
          test -n "$APPLE_APP_SPECIFIC_PASSWORD" || { echo "Missing APPLE_APP_SPECIFIC_PASSWORD" >&2; exit 2; }
          test -n "$APPLE_TEAM_ID" || { echo "Missing APPLE_TEAM_ID" >&2; exit 2; }
      - if: runner.os == 'Windows'
        name: Build DirectX 11 Windows packages
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: npm run build:win:directx
      - if: runner.os == 'Windows'
        name: Build OpenGL Windows packages
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: npm run build:win:opengl
      - name: Build signed platform packages
        env:
          CSC_LINK: ${{ runner.os == 'Windows' && secrets.WINDOWS_CSC_LINK || (runner.os == 'macOS' && secrets.APPLE_CSC_LINK) || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WINDOWS_CSC_KEY_PASSWORD || (runner.os == 'macOS' && secrets.APPLE_CSC_KEY_PASSWORD) || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: voiceconnect-${{ matrix.os }}-release
          path: |
            voiceconnect-p2p/dist/*.exe
            voiceconnect-p2p/dist/*.msi
            voiceconnect-p2p/dist/*.AppImage
            voiceconnect-p2p/dist/*.deb
            voiceconnect-p2p/dist/*.dmg
            voiceconnect-p2p/dist/*.zip
            voiceconnect-p2p/dist/*.rpm
          if-no-files-found: error
          retention-days: 90
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: voiceconnect-windows-directx-release
          path: |
            voiceconnect-p2p/dist/directx/*.exe
            voiceconnect-p2p/dist/directx/*.msi
          if-no-files-found: error
          retention-days: 90
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: voiceconnect-windows-opengl-release
          path: |
            voiceconnect-p2p/dist/opengl/*.exe
            voiceconnect-p2p/dist/opengl/*.msi
          if-no-files-found: error
          retention-days: 90

  browser-extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and package browser extensions
        run: |
          node -e "for (const p of ['voiceconnect-p2p/extensions/chromium/manifest.json','voiceconnect-p2p/extensions/firefox/manifest.json']) { const m=require('./'+p); if(m.manifest_version!==3 || !m.action?.default_popup) process.exit(1); }"
          node --check voiceconnect-p2p/extensions/chromium/popup.js
          node --check voiceconnect-p2p/extensions/firefox/popup.js
          cd voiceconnect-p2p/extensions
          zip -r ../../voiceconnect-chrome-edge-extension.zip chromium
          zip -r ../../voiceconnect-firefox-extension.zip firefox
      - uses: actions/upload-artifact@v4
        with:
          name: voiceconnect-browser-extensions-release
          path: |
            voiceconnect-chrome-edge-extension.zip
            voiceconnect-firefox-extension.zip
          if-no-files-found: error
          retention-days: 90
  publish:
    needs: [package, browser-extensions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: voiceconnect-*-release
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release-assets/* --title "VoiceConnect $TAG" --generate-notes
