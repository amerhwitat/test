name: VoiceConnect cross-platform validation
on:
  pull_request:
    paths:
      - "voiceconnect-p2p/**"
      - ".github/workflows/voiceconnect-build.yml"
  push:
    branches: [main]
    paths:
      - "voiceconnect-p2p/**"
      - ".github/workflows/voiceconnect-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: ubuntu-latest
            script: build:linux
          - os: macos-latest
            script: build:mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: voiceconnect-p2p
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libfuse2
      - run: npm install
      - run: npm install --no-save sharp png-to-ico
      - run: node generate-icon.mjs
      - run: npm test
      - run: npm run ${{ matrix.script }}
      - if: runner.os == 'Windows'
        name: Launch packaged desktop and verify GUI startup
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist/win-unpacked/VoiceConnect P2P.exe"
          if (!(Test-Path $exe)) { throw "Packaged desktop executable missing: $exe" }
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 12
            $process.Refresh()
            if ($process.HasExited) { throw "VoiceConnect exited during startup (exit code $($process.ExitCode))" }
            $logs = Get-ChildItem "$env:APPDATA" -Filter startup.log -Recurse -ErrorAction SilentlyContinue
            $log = $logs | Where-Object { (Get-Content $_.FullName -Raw) -match "VoiceConnect desktop startup completed" } | Select-Object -First 1
            if (!$log) {
              $found = ($logs | ForEach-Object { $_.FullName }) -join "; "
              throw "Desktop startup completion was not logged. Logs found: $found"
            }
            Write-Host "Desktop process stayed alive and GUI startup completed. Log: $($log.FullName)"
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: voiceconnect-${{ matrix.os }}-desktop
          path: voiceconnect-p2p/dist/*
          if-no-files-found: error
          retention-days: 30
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: voiceconnect-windows-directx
          path: voiceconnect-p2p/dist/directx/*
          if-no-files-found: error
          retention-days: 30
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: voiceconnect-windows-opengl
          path: voiceconnect-p2p/dist/opengl/*
          if-no-files-found: error
          retention-days: 30
  native-clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile voiceconnect-p2p/clients/python/voiceconnect.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: javac -encoding UTF-8 voiceconnect-p2p/clients/java/VoiceConnectChat.java
      - run: sudo apt-get update && sudo apt-get install -y libboost-system-dev
      - run: cmake -S voiceconnect-p2p/clients/cpp -B build/voiceconnect-cpp
      - run: cmake --build build/voiceconnect-cpp --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: voiceconnect-native-chat-clients
          path: |
            build/voiceconnect-cpp/voiceconnect-chat
            voiceconnect-p2p/clients/java/VoiceConnectChat.class
            voiceconnect-p2p/clients/python/voiceconnect.py
            voiceconnect-p2p/clients/python/requirements.txt
          if-no-files-found: error
          retention-days: 30
