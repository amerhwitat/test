name: VoiceConnect cross-platform validation
on:
  pull_request:
    paths:
      - "voiceconnect-p2p/**"
      - ".github/workflows/voiceconnect-build.yml"
  push:
    branches: [main]
    paths:
      - "voiceconnect-p2p/**"
      - ".github/workflows/voiceconnect-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: ubuntu-latest
            script: build:linux
          - os: macos-latest
            script: build:mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: voiceconnect-p2p
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run ${{ matrix.script }}
  native-clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile voiceconnect-p2p/clients/python/voiceconnect.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: javac -encoding UTF-8 voiceconnect-p2p/clients/java/VoiceConnectChat.java
      - run: cmake -S voiceconnect-p2p/clients/cpp -B build/voiceconnect-cpp
      - run: cmake --build build/voiceconnect-cpp
