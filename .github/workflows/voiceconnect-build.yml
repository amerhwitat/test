name: VoiceConnect cross-platform validation
on:
  pull_request:
    paths:
      - "voiceconnect-p2p/**"
      - ".github/workflows/voiceconnect-build.yml"
  push:
    branches: [main]
    tags: ["voiceconnect-v*"]
    paths:
      - "voiceconnect-p2p/**"
      - ".github/workflows/voiceconnect-build.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voiceconnect-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: ubuntu-latest
            script: build:linux
          - os: macos-latest
            script: build:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: voiceconnect-p2p
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libfuse2
      - name: Install from the committed lockfile when available
        run: |
          node -e "const fs=require('node:fs');const {spawnSync}=require('node:child_process');const cmd=fs.existsSync('package-lock.json')?'ci':'install';console.log('Running npm '+cmd);const r=spawnSync('npm',[cmd],{stdio:'inherit',shell:process.platform==='win32'});process.exit(r.status===null?1:r.status)"
      - name: Capture dependency-level npm audit report
        run: |
          node -e "const fs=require('node:fs');const {spawnSync}=require('node:child_process');const r=spawnSync('npm audit --json',{encoding:'utf8',shell:true});const raw=r.stdout||r.stderr||'{}';fs.writeFileSync('npm-audit-report.json',raw);if(r.error){console.error('npm audit could not execute:',r.error);process.exit(1)}let a;try{a=JSON.parse(raw)}catch(e){console.error('npm audit did not return valid JSON');process.exit(1)}if(!a||typeof a.metadata!=='object'||!a.metadata||typeof a.metadata.vulnerabilities!=='object'||!a.vulnerabilities||typeof a.vulnerabilities!=='object'||a.error){console.error('npm audit returned an incomplete/error response; refusing to treat it as a clean report:',JSON.stringify(a.error||a));process.exit(1)}if(r.status!==0&&r.status!==1){console.error('npm audit exited unexpectedly:',r.status);process.exit(1)}const rows=Object.entries(a.vulnerabilities).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:(v.via||[]).map(x=>typeof x==='string'?x:{name:x.name,title:x.title,url:x.url,range:x.range})}));console.log(JSON.stringify({counts:a.metadata.vulnerabilities,packages:rows},null,2));"
      - name: Block builds with high or critical dependency advisories
        run: |
          node -e "const a=JSON.parse(require('node:fs').readFileSync('npm-audit-report.json','utf8'));const v=a.metadata?.vulnerabilities||{};console.log('npm audit counts:',JSON.stringify(v));if((v.high||0)>0||(v.critical||0)>0)process.exit(1)"
      - run: node generate-icon.mjs
      - run: npm test
      - run: npm run ${{ matrix.script }}
      - if: runner.os == 'Windows'
        name: Build Direct3D 11 and OpenGL variants
        run: |
          npm run build:win:directx
          npm run build:win:opengl
      - if: runner.os == 'Windows'
        name: Verify and install-test base, Direct3D 11 and OpenGL packages
        shell: pwsh
        run: |
          $targets = @(
            @{ Name = "base"; Folder = (Join-Path $PWD "dist") },
            @{ Name = "directx"; Folder = (Join-Path $PWD "dist/directx") },
            @{ Name = "opengl"; Folder = (Join-Path $PWD "dist/opengl") }
          )
          foreach ($target in $targets) {
            $msi = Get-ChildItem $target.Folder -Filter *.msi -File -ErrorAction SilentlyContinue
            $portable = Get-ChildItem $target.Folder -Filter *.exe -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -notmatch "uninstall|setup" }
            if (!$msi) { throw "Missing $($target.Name) MSI artifact in $($target.Folder)" }
            if (!$portable) { throw "Missing $($target.Name) portable executable in $($target.Folder)" }
            Write-Host "$($target.Name) MSI: $($msi[0].Name); portable: $($portable[0].Name)"
            foreach ($operation in @(
              @{ Name = "install"; Verb = "/i"; Log = (Join-Path $env:RUNNER_TEMP "$($target.Name)-install.log") },
              @{ Name = "uninstall"; Verb = "/x"; Log = (Join-Path $env:RUNNER_TEMP "$($target.Name)-uninstall.log") }
            )) {
              # Quote the MSI path explicitly: Start-Process joins ArgumentList
              # into a command line and does not quote paths containing spaces.
              $msiPath = $msi[0].FullName
              $argumentLine = "$($operation.Verb) `"$msiPath`" /qn /norestart /L*v `"$($operation.Log)`""
              Write-Host "Running msiexec.exe $argumentLine"
              $process = Start-Process -FilePath msiexec.exe -ArgumentList $argumentLine -PassThru
              if (!$process.WaitForExit(900000)) {
                $running = Get-Process msiexec -ErrorAction SilentlyContinue |
                  Select-Object Id, StartTime, CPU, Responding
                Write-Host "Timed-out msiexec processes: $($running | ConvertTo-Json -Compress)"
                Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
                if (Test-Path $operation.Log) {
                  Write-Host "Last 120 lines of $($operation.Log):"
                  Get-Content $operation.Log -Tail 120
                }
                throw "$($target.Name) MSI $($operation.Verb) exceeded the 15-minute timeout; msiexec was terminated."
              }
              $process.Refresh()
              if ($process.ExitCode -notin @(0,3010)) {
                if (Test-Path $operation.Log) {
                  Write-Host "Last 120 lines of $($operation.Log):"
                  Get-Content $operation.Log -Tail 120
                }
                throw "$($target.Name) MSI $($operation.Verb) failed: $($process.ExitCode)"
              }
              Write-Host "$($target.Name) MSI $($operation.Verb) completed with exit code $($process.ExitCode)."
            }
            Write-Host "$($target.Name) MSI install/uninstall smoke test passed."
          }
      - if: runner.os == 'Windows'
        name: Launch packaged desktop and verify GUI startup
        shell: pwsh
        run: |
          $variants = @(
            @{ Name = "base"; Exe = "dist/win-unpacked/VoiceConnect P2P.exe" },
            @{ Name = "directx"; Exe = "dist/directx/win-unpacked/VoiceConnect P2P DirectX 11.exe" },
            @{ Name = "opengl"; Exe = "dist/opengl/win-unpacked/VoiceConnect P2P OpenGL.exe" }
          )
          foreach ($variant in $variants) {
            $exe = Join-Path $PWD $variant.Exe
            if (!(Test-Path $exe)) { throw "$($variant.Name) packaged executable missing: $exe" }
            $process = Start-Process -FilePath $exe -PassThru
            try {
              Start-Sleep -Seconds 12
              $process.Refresh()
              if ($process.HasExited) { throw "$($variant.Name) VoiceConnect exited during startup (exit code $($process.ExitCode))" }
              $logs = Get-ChildItem "$env:APPDATA" -Filter startup.log -Recurse -ErrorAction SilentlyContinue
              $log = $logs | Where-Object { (Get-Content $_.FullName -Raw) -match "VoiceConnect desktop startup completed" } | Select-Object -First 1
              if (!$log) {
                $found = ($logs | ForEach-Object { $_.FullName }) -join "; "
                throw "$($variant.Name) desktop startup completion was not logged. Logs found: $found"
              }
              Write-Host "$($variant.Name) desktop process stayed alive and GUI startup completed. Log: $($log.FullName)"
            } finally {
              if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
            }
          }
      - if: runner.os == 'Windows'
        name: Verify real Windows mouse clicks through Chromium input dispatch
        shell: pwsh
        run: node scripts/windows-click-smoke.mjs "dist/win-unpacked/VoiceConnect P2P.exe"
      - if: always() && runner.os == 'Windows'
        name: Upload Windows MSI diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: voiceconnect-windows-diagnostics
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*.txt
          if-no-files-found: ignore
          retention-days: 30
      - if: always() && hashFiles('voiceconnect-p2p/npm-audit-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: voiceconnect-${{ matrix.os }}-npm-audit
          path: voiceconnect-p2p/npm-audit-report.json
          if-no-files-found: error
          retention-days: 30
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voiceconnect-${{ matrix.os }}-desktop
          path: voiceconnect-p2p/dist/*
          if-no-files-found: error
          retention-days: 30
      - if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: voiceconnect-windows-directx
          path: voiceconnect-p2p/dist/directx/*
          if-no-files-found: error
          retention-days: 30
      - if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: voiceconnect-windows-opengl
          path: voiceconnect-p2p/dist/opengl/*
          if-no-files-found: error
          retention-days: 30
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOMAIN: meet.example.invalid
      ACME_EMAIL: ci@example.invalid
      ALLOWED_ORIGINS: https://meet.example.invalid
      VOICECONNECT_AUTH_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      VOICECONNECT_ADMIN_SECRET: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
      TURN_REALM: meet.example.invalid
      TURN_EXTERNAL_IP: 203.0.113.10
      TURN_SHARED_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      TURN_URL: turn:meet.example.invalid:3478?transport=udp,turn:meet.example.invalid:3478?transport=tcp
      STUN_URL: stun:meet.example.invalid:3478
    defaults:
      run:
        working-directory: voiceconnect-p2p
    steps:
      - uses: actions/checkout@v4
      - name: Create disposable validation environment file
        run: |
          cat > .env.production <<EOF
          DOMAIN=${DOMAIN}
          ACME_EMAIL=${ACME_EMAIL}
          ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
          VOICECONNECT_AUTH_SECRET=${VOICECONNECT_AUTH_SECRET}
          VOICECONNECT_ADMIN_SECRET=${VOICECONNECT_ADMIN_SECRET}
          TURN_REALM=${TURN_REALM}
          TURN_EXTERNAL_IP=${TURN_EXTERNAL_IP}
          TURN_SHARED_SECRET=${TURN_SHARED_SECRET}
          TURN_URL=${TURN_URL}
          STUN_URL=${STUN_URL}
          PORT=8787
          EOF
      - name: Validate production Compose configuration
        run: docker compose -f docker-compose.production.yml config --quiet
      - name: Build production signaling container
        run: docker compose -f docker-compose.production.yml build app
      - name: Validate Caddy reverse-proxy configuration
        run: |
          docker run --rm -e DOMAIN -e ACME_EMAIL -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  native-clients:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile voiceconnect-p2p/clients/python/voiceconnect.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: javac -encoding UTF-8 voiceconnect-p2p/clients/java/VoiceConnectChat.java
      - run: sudo apt-get update && sudo apt-get install -y libboost-system-dev
      - run: cmake -S voiceconnect-p2p/clients/cpp -B build/voiceconnect-cpp
      - run: cmake --build build/voiceconnect-cpp --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: voiceconnect-native-chat-clients
          path: |
            build/voiceconnect-cpp/voiceconnect-chat
            voiceconnect-p2p/clients/java/VoiceConnectChat.class
            voiceconnect-p2p/clients/python/voiceconnect.py
            voiceconnect-p2p/clients/python/requirements.txt
          if-no-files-found: error
          retention-days: 30

  browser-extensions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Chrome, Edge and Firefox extension manifests
        run: |
          node -e "for (const p of ['voiceconnect-p2p/extensions/chromium/manifest.json','voiceconnect-p2p/extensions/firefox/manifest.json']) { const m=require('./'+p); if(m.manifest_version!==3 || !m.action?.default_popup) process.exit(1); console.log(p, m.name, m.version); }"
          node --check voiceconnect-p2p/extensions/chromium/popup.js
          node --check voiceconnect-p2p/extensions/firefox/popup.js
      - name: Package browser extensions
        run: |
          cd voiceconnect-p2p/extensions
          zip -r ../voiceconnect-chrome-edge-extension.zip chromium
          zip -r ../voiceconnect-firefox-extension.zip firefox
      - uses: actions/upload-artifact@v4
        with:
          name: voiceconnect-browser-extensions
          path: |
            voiceconnect-p2p/voiceconnect-chrome-edge-extension.zip
            voiceconnect-p2p/voiceconnect-firefox-extension.zip
          if-no-files-found: error
          retention-days: 90


  publish-preview:
    if: startsWith(github.ref, 'refs/tags/voiceconnect-v')
    needs: [desktop, native-clients, browser-extensions, infrastructure]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require tagged commit to be reachable from main
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Refusing publication: tagged commit is not reachable from main."
            exit 1
          }
      - uses: actions/download-artifact@v4
        with:
          name: voiceconnect-windows-latest-desktop
          path: release-assets/windows
      - uses: actions/download-artifact@v4
        with:
          name: voiceconnect-windows-directx
          path: release-assets/windows-directx
      - uses: actions/download-artifact@v4
        with:
          name: voiceconnect-windows-opengl
          path: release-assets/windows-opengl
      - uses: actions/download-artifact@v4
        with:
          name: voiceconnect-ubuntu-latest-desktop
          path: release-assets/linux
      - uses: actions/download-artifact@v4
        with:
          name: voiceconnect-macos-latest-desktop
          path: release-assets/macos
      - uses: actions/download-artifact@v4
        with:
          name: voiceconnect-browser-extensions
          path: release-assets/browser-extensions
      - uses: actions/download-artifact@v4
        with:
          name: voiceconnect-native-chat-clients
          path: release-assets/native-clients
      - uses: actions/download-artifact@v4
        with:
          name: voiceconnect-windows-latest-npm-audit
          path: release-assets/audit-windows
      - uses: actions/download-artifact@v4
        with:
          name: voiceconnect-ubuntu-latest-npm-audit
          path: release-assets/audit-linux
      - uses: actions/download-artifact@v4
        with:
          name: voiceconnect-macos-latest-npm-audit
          path: release-assets/audit-macos
      - name: Block publication on high or critical dependency advisories
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const paths = [
            'release-assets/audit-windows/npm-audit-report.json',
            'release-assets/audit-linux/npm-audit-report.json',
            'release-assets/audit-macos/npm-audit-report.json'
          ];
          let blocked = false;
          for (const path of paths) {
            if (!fs.existsSync(path)) throw new Error('Missing dependency audit report: ' + path);
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const counts = report.metadata?.vulnerabilities || {};
            console.log(path, JSON.stringify(counts));
            if ((counts.high || 0) > 0 || (counts.critical || 0) > 0) blocked = true;
          }
          if (blocked) throw new Error('Release blocked: high or critical dependency advisories remain.');
          NODE
      - name: Create release checksums
        run: |
          find release-assets -type f -print0 | sort -z | xargs -0 sha256sum > release-assets/SHA256SUMS.txt
      - name: Publish unsigned preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VoiceConnect ${{ github.ref_name }} (Preview)
          draft: false
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/**/*
          body: |
            **Preview release. Not production-certified.**

            Windows, Linux and macOS packages and companion clients are attached with SHA-256 checksums. This preview is not Authenticode-signed, macOS Developer ID-signed or notarized. No independent penetration test or formal cryptographic audit is claimed. Verify the checksums and scan downloads before running them. Do not bypass operating-system security warnings.
