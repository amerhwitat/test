name: PortfolioTestApple
options:
  bundleIdPrefix: com.amerhwitat
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
targets:
  PortfolioTestApple:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amerhwitat.portfoliotest
        GENERATE_INFOPLIST_FILE: YES
  PortfolioTestMac:
    type: application
    platform: macOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amerhwitat.portfoliotest.mac
        GENERATE_INFOPLIST_FILE: YES
